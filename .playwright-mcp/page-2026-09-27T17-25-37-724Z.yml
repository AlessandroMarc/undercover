          - heading "The customer's story" [level=3] [ref=f2e490]
          - paragraph [ref=f2e491]: I flew to Milan on June 3 for my brother's wedding on Lake Como, where I was the best man. My checked suitcase never arrived. Meridian Air searched for three weeks and declared it lost on June 24, and they have paid me $350 under their own rules. I have listed everything that was in the bag with what I paid for it. The formalwear and the camera gear were bought this spring for the wedding, and the receipts are attached along with my card statement for the suitcase and the cufflinks. I gave the best man's speech in a jacket borrowed from the head waiter, which got a bigger laugh than the speech did.
