            - paragraph [ref=f2e551]: "Harborview Formalwear, Boston, April 11, 2026. Two piece tuxedo, black: jacket $290.00, trousers $190.00. Black oxford dress shoes: $230.00. Four dress shirts at $85.00 each: $340.00. Total: $1,050.00."
          - article [ref=f2e552]:
