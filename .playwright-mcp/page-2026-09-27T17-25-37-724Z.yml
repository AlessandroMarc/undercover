            - paragraph [ref=f2e542]: Carrier report
            - paragraph [ref=f2e543]: Meridian Air property irregularity report MXP-MA-30418. Passenger Owen Gallagher arrived Milan MXP June 3, 2026 on MA 402 from Boston. One checked bag, tag MA 771204, not delivered.
          - article [ref=f2e544]:
            - heading "Meridian Air settlement letter" [level=3] [ref=f2e545]
            - paragraph [ref=f2e546]: Letter
            - paragraph [ref=f2e547]: Meridian Air, June 24, 2026. Dear Mr. Gallagher, after a search of 21 days we have been unable to find your bag, tag MA 771204, and we now treat it as lost. We have paid $350.00 to your card in full settlement of our liability.
